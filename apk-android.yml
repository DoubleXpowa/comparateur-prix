# Compile l'APK Android de l'app à partir de comparateur_prix.html, gratuitement sur GitHub.
# Se lance tout seul quand l'app change, ou à la main : onglet Actions → APK Android → Run workflow.
# Le résultat est publié dans Releases, avec un lien fixe :
#   https://github.com/<toi>/<dépôt>/releases/latest/download/Comparateur.apk
name: APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - comparateur_prix.html
      - fonts/**
      - android-app/**
      - .github/workflows/apk-android.yml

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets de signature
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Secrets KEYSTORE_B64 et KEYSTORE_PASSWORD manquants (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Préparer le projet Android
        working-directory: android-app
        run: |
          npm ci
          rm -rf www android
          mkdir www
          cp ../comparateur_prix.html www/index.html
          cp -r ../fonts ../manifest.json ../icon-192.png ../icon-512.png www/
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          VERSION=$(grep -oP "APP_VERSION = '\K[^']+" www/index.html)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Compiler
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Signer
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android-app/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-key-alias comparateur \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out Comparateur.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify Comparateur.apk
          rm -f "$RUNNER_TEMP/ks.jks"

      - name: Publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Comparateur v${{ env.VERSION }} (build ${{ github.run_number }})
          body: |
            Télécharger sur le téléphone : **Comparateur.apk** ci-dessous, puis l'ouvrir pour l'installer.
            Pour une mise à jour, installer par-dessus : les données sont conservées.
          files: Comparateur.apk
          make_latest: true
